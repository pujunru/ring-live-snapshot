capture:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    filename:
      example: /media/garage_front/live.jpg
      selector:
        text:
    settle:
      default: 1.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
    timeout:
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: s
