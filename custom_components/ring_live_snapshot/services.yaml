capture:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    filename:
      example: /media/garage_front/live.jpg
      selector:
        text:
    settle:
      default: 1.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
    timeout:
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: s

draw_boxes:
  fields:
    source:
      required: true
      example: /media/garage_front/live.jpg
      selector:
        text:
    filename:
      required: true
      example: /media/garage_front/live_boxed.jpg
      selector:
        text:
    objects:
      example: '[{"label": "package", "box_2d": [439, 459, 662, 538]}]'
      selector:
        object:

detect:
  fields:
    source:
      required: true
      example: /media/garage_front/live.jpg
      selector:
        text:
    model_id:
      required: true
      example: package-detection/3
      selector:
        text:
    confidence:
      default: 0.4
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    filename:
      example: /media/garage_front/live_roboflow.jpg
      selector:
        text:
    confirm:
      example: '[{"label": "package", "box_2d": [572, 437, 782, 541]}]'
      selector:
        object:
    min_iou:
      default: 0.3
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
